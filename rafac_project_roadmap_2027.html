<h2 class="sr-only">Roadmap of twenty RAFAC military skills projects across 2027, grouped by owner, showing which are fixed-timeframe and which are ongoing</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.rm-section{font-size:12px;font-weight:500;color:var(--text-secondary);margin:14px 0 6px;padding-top:8px;border-top:0.5px solid var(--border)}
.rm-section:first-of-type{border-top:none;padding-top:0;margin-top:0}
.rm-row{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:12px;min-height:28px}
.rm-name{font-size:13px;color:var(--text-primary);line-height:1.3}
.rm-track{position:relative;height:18px;border-radius:4px;background-image:linear-gradient(to right, var(--border) 0, var(--border) 1px, transparent 1px);background-size:calc(100%/12) 100%}
.rm-bar{position:absolute;top:2px;height:14px;border-radius:4px}
.rm-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--text-secondary);margin-bottom:14px}
.rm-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
</style>
<div id="rm-legend" class="rm-legend"></div>
<div id="rm-header" class="rm-row" style="margin-bottom:8px"></div>
<div id="rm-body"></div>
<script>
const themeMode = document.documentElement.dataset.mode;
const isDark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const owners = {
  dan:   { label: 'Wg Cdr Azizian', light: '#2a78d6', dark: '#3987e5' },
  matt:  { label: 'Wg Cdr Oram',    light: '#eb6834', dark: '#d95926' },
  joint: { label: 'Joint',          light: '#6250d6', dark: '#9085e9' }
};
function ownerColor(o){ return isDark ? owners[o].dark : owners[o].light; }

const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthShort = ['J','F','M','A','M','J','J','A','S','O','N','D'];

const projects = [
  { owner:'dan', name:'ACP 18 Vol 1', type:'ongoing' },
  { owner:'dan', name:'ACP 18 Vol 3', type:'ongoing' },
  { owner:'dan', name:'Unified Air Rifle Manual', type:'timed', start:0, end:3 },
  { owner:'dan', name:'Rifle & Fieldcraft Lesson Logging', type:'timed', start:1, end:4 },
  { owner:'dan', name:'Digital Annual Reviews of Qualifications', type:'timed', start:1, end:5 },
  { owner:'dan', name:'RAFAC APSC Course re-write', type:'timed', start:4, end:8 },
  { owner:'dan', name:'SASC Course Pre-requisites', type:'timed', start:5, end:8 },
  { owner:'dan', name:'CSM adoption', type:'timed', start:6, end:9 },
  { owner:'dan', name:'SSO Generator v2', type:'timed', start:8, end:11 },
  { owner:'dan', name:'Reporting Portal', type:'timed', start:8, end:11 },
  { owner:'dan', name:'Parenting Review', type:'timed', start:9, end:10 },
  { owner:'matt', name:'Shooting & Fieldcraft data reporting', type:'timed', start:3, end:7 },
  { owner:'matt', name:'New declaration in CTR', type:'timed', start:2, end:4 },
  { owner:'matt', name:'ShO & FTO TORs', type:'timed', start:4, end:7 },
  { owner:'matt', name:'Coaching Courses review & development', type:'timed', start:5, end:9 },
  { owner:'matt', name:'Air Rifle Admin Simplification', type:'timed', start:3, end:6 },
  { owner:'matt', name:'All Shooting Competition governance and participation', type:'ongoing' },
  { owner:'joint', name:'Digital Policy Project', type:'timed', start:0, end:5 },
  { owner:'joint', name:'CLF logging', type:'timed', start:2, end:6 },
  { owner:'joint', name:'Military Skills Knowledge Hub', type:'timed', start:7, end:11 }
];

const legend = document.getElementById('rm-legend');
Object.keys(owners).forEach(o => {
  const span = document.createElement('span');
  span.innerHTML = '<span class="rm-dot" style="background:' + ownerColor(o) + '"></span>' + owners[o].label;
  legend.appendChild(span);
});
const hatchNote = document.createElement('span');
hatchNote.textContent = 'Striped bar = ongoing / no fixed end';
legend.appendChild(hatchNote);

const header = document.getElementById('rm-header');
header.innerHTML = '<span></span><div style="display:grid;grid-template-columns:repeat(12,1fr);font-size:11px;color:var(--text-muted);text-align:center">' +
  monthShort.map(m => '<span>' + m + '</span>').join('') + '</div>';

const body = document.getElementById('rm-body');
const order = ['dan','matt','joint'];
order.forEach(ownerKey => {
  const section = document.createElement('div');
  section.className = 'rm-section';
  section.textContent = owners[ownerKey].label + (ownerKey === 'joint' ? ' & ' + owners.dan.label + ' + ' + owners.matt.label : '');
  section.textContent = ownerKey === 'joint' ? 'Joint projects (both Wings)' : owners[ownerKey].label;
  body.appendChild(section);

  projects.filter(p => p.owner === ownerKey).forEach(p => {
    const row = document.createElement('div');
    row.className = 'rm-row';
    const color = ownerColor(p.owner);
    const isOngoing = p.type === 'ongoing';
    const left = isOngoing ? 0 : (p.start / 12) * 100;
    const width = isOngoing ? 100 : ((p.end - p.start + 1) / 12) * 100;
    const dateText = isOngoing ? 'Ongoing, no fixed end' : (monthNames[p.start] + '\u2013' + monthNames[p.end] + ' 2027');
    const barStyle = isOngoing
      ? 'background-image: repeating-linear-gradient(135deg, ' + color + ' 0 4px, transparent 4px 8px); border-radius: 2px;'
      : 'background-color: ' + color + ';';
    row.innerHTML =
      '<span class="rm-name">' + p.name + '</span>' +
      '<div class="rm-track">' +
        '<div class="rm-bar" title="' + p.name + ' \u2014 ' + dateText + '" style="left:' + left + '%; width:' + width + '%; ' + barStyle + '"></div>' +
      '</div>';
    body.appendChild(row);
  });
});
</script>
