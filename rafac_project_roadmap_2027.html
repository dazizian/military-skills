<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAFAC project roadmap — 2027</title>
<style>
  :root{
    --surface-1:#f2f1ed;
    --surface-2:#ffffff;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:#898781;
    --border:rgba(11,11,11,0.12);
    --border-strong:rgba(11,11,11,0.28);
    --border-accent:#2a78d6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface-1:#242422;
      --surface-2:#1a1a19;
      --text-primary:#f0efec;
      --text-secondary:#c3c2b7;
      --text-muted:#898781;
      --border:rgba(255,255,255,0.14);
      --border-strong:rgba(255,255,255,0.28);
      --border-accent:#3987e5;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:32px 24px 64px;
    background:var(--surface-2);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .rm-wrap{max-width:900px;margin:0 auto}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  .rm-caption{font-size:13px;color:var(--text-secondary);margin:0 0 24px}
  .rm-section{font-size:12px;font-weight:600;color:var(--text-secondary);margin:16px 0 6px;padding-top:10px;border-top:0.5px solid var(--border)}
  .rm-section:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .rm-row{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:12px;min-height:30px;cursor:pointer;padding:2px 6px;border-radius:6px}
  .rm-row:hover{background:var(--surface-1)}
  .rm-row:focus-visible{outline:2px solid var(--border-accent);outline-offset:2px}
  .rm-name{font-size:13px;color:var(--text-primary);display:flex;align-items:center;justify-content:space-between;gap:6px}
  .rm-chevron{color:var(--text-muted);transition:transform .15s;flex-shrink:0;display:inline-flex}
  .rm-chevron svg{display:block}
  .rm-row[aria-expanded="true"] .rm-chevron{transform:rotate(180deg)}
  .rm-track{position:relative;height:18px;border-radius:4px;background-image:linear-gradient(to right, var(--border) 0, var(--border) 1px, transparent 1px);background-size:calc(100%/12) 100%}
  .rm-bar{position:absolute;top:2px;height:14px;border-radius:4px}
  .rm-detail{display:none;padding:2px 0 14px 212px}
  .rm-detail p{margin:0;font-size:12px;line-height:1.5;padding-left:10px}
  .rm-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--text-secondary);margin-bottom:18px}
  .rm-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .rm-header{cursor:default}
</style>
</head>
<body>
<div class="rm-wrap">
  <h1>RAFAC project roadmap — 2027</h1>
  <p class="rm-caption">Illustrative timeline — dates are placeholders pending confirmation.</p>
  <div id="rm-legend" class="rm-legend"></div>
  <div id="rm-header" class="rm-row rm-header"></div>
  <div id="rm-body"></div>
</div>
<script>
const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const owners = {
  dan:   { label: 'Wg Cdr Azizian', light: '#2a78d6', dark: '#3987e5' },
  matt:  { label: 'Wg Cdr Oram',    light: '#eb6834', dark: '#d95926' },
  joint: { label: 'Joint',          light: '#6250d6', dark: '#9085e9' }
};
function ownerColor(o){ return isDark ? owners[o].dark : owners[o].light; }
const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthShort = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const noSummary = 'No summary added yet.';
const chevronSVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

const projects = [
  { owner:'dan', name:'ACP 18 Vol 1', type:'ongoing', summary:noSummary },
  { owner:'dan', name:'ACP 18 Vol 3', type:'ongoing', summary:noSummary },
  { owner:'dan', name:'Unified Air Rifle Manual', type:'timed', start:0, end:3, hasSummary:true, summary:'Creating a new version of Cadet Training - Skill At Arms for the Air Rifle, which combines the lessons and WHTs for the different air rifles / variants. The goal is to reduce training and testing burden, recognising that there is no real difference in drills or safe handling of different PCP air rifles, only where there is a difference between single-shot and magazine-fed variants. This is a tri-Service document and policy, led by RAFAC. Oversight provided by Spencer James.' },
  { owner:'dan', name:'Rifle & Fieldcraft Lesson Logging', type:'timed', start:1, end:4, summary:noSummary },
  { owner:'dan', name:'Digital Annual Reviews of Qualifications', type:'timed', start:1, end:5, summary:noSummary },
  { owner:'dan', name:'RAFAC APSC Course re-write', type:'timed', start:4, end:8, summary:noSummary },
  { owner:'dan', name:'SASC Course Pre-requisites', type:'timed', start:5, end:8, summary:noSummary },
  { owner:'dan', name:'CSM adoption', type:'timed', start:6, end:9, summary:noSummary },
  { owner:'dan', name:'SSO Generator v2', type:'timed', start:8, end:11, summary:noSummary },
  { owner:'dan', name:'Reporting Portal', type:'timed', start:8, end:11, summary:noSummary },
  { owner:'dan', name:'Parenting Review', type:'timed', start:9, end:10, summary:noSummary },
  { owner:'matt', name:'Shooting & Fieldcraft data reporting', type:'timed', start:3, end:7, summary:noSummary },
  { owner:'matt', name:'New declaration in CTR', type:'timed', start:2, end:4, summary:noSummary },
  { owner:'matt', name:'ShO & FTO TORs', type:'timed', start:4, end:7, summary:noSummary },
  { owner:'matt', name:'Coaching Courses review & development', type:'timed', start:5, end:9, summary:noSummary },
  { owner:'matt', name:'Air Rifle Admin Simplification', type:'timed', start:3, end:6, summary:noSummary },
  { owner:'matt', name:'All Shooting Competition governance and participation', type:'ongoing', summary:noSummary },
  { owner:'joint', name:'Digital Policy Project', type:'timed', start:0, end:5, summary:noSummary },
  { owner:'joint', name:'CLF logging', type:'timed', start:2, end:6, summary:noSummary },
  { owner:'joint', name:'Military Skills Knowledge Hub', type:'timed', start:7, end:11, summary:noSummary }
];

const legend = document.getElementById('rm-legend');
Object.keys(owners).forEach(o => {
  const span = document.createElement('span');
  span.innerHTML = '<span class="rm-dot" style="background:' + ownerColor(o) + '"></span>' + owners[o].label;
  legend.appendChild(span);
});
const note1 = document.createElement('span'); note1.textContent = 'Striped bar = ongoing'; legend.appendChild(note1);
const note2 = document.createElement('span'); note2.textContent = 'Hover name = summary, hover bar = dates, click row = expand'; legend.appendChild(note2);

const header = document.getElementById('rm-header');
header.innerHTML = '<span></span><div style="display:grid;grid-template-columns:repeat(12,1fr);font-size:11px;color:var(--text-muted);text-align:center">' +
  monthShort.map(m => '<span>' + m + '</span>').join('') + '</div>';

function buildRow(p){
  const wrap = document.createElement('div');

  const row = document.createElement('div');
  row.className = 'rm-row';
  row.tabIndex = 0;
  row.setAttribute('role','button');
  row.setAttribute('aria-expanded','false');

  const nameSpan = document.createElement('span');
  nameSpan.className = 'rm-name';
  const nameText = document.createElement('span');
  nameText.textContent = p.name;
  nameText.title = p.summary.length > 90 ? (p.summary.slice(0,90) + '\u2026') : p.summary;
  const chev = document.createElement('span');
  chev.className = 'rm-chevron';
  chev.innerHTML = chevronSVG;
  nameSpan.appendChild(nameText);
  nameSpan.appendChild(chev);

  const track = document.createElement('div');
  track.className = 'rm-track';
  const bar = document.createElement('div');
  bar.className = 'rm-bar';
  const color = ownerColor(p.owner);
  const isOngoing = p.type === 'ongoing';
  const left = isOngoing ? 0 : (p.start/12)*100;
  const width = isOngoing ? 100 : ((p.end-p.start+1)/12)*100;
  const dateText = isOngoing ? 'Ongoing, no fixed end' : (monthNames[p.start] + '\u2013' + monthNames[p.end] + ' 2027');
  bar.title = p.name + ' \u2014 ' + dateText;
  bar.style.left = left + '%';
  bar.style.width = width + '%';
  if (isOngoing) {
    bar.style.backgroundImage = 'repeating-linear-gradient(135deg, ' + color + ' 0 4px, transparent 4px 8px)';
    bar.style.borderRadius = '2px';
  } else {
    bar.style.backgroundColor = color;
  }
  track.appendChild(bar);

  row.appendChild(nameSpan);
  row.appendChild(track);

  const detail = document.createElement('div');
  detail.className = 'rm-detail';
  const detailP = document.createElement('p');
  detailP.style.borderLeft = '2px solid ' + color;
  detailP.style.color = p.hasSummary ? 'var(--text-secondary)' : 'var(--text-muted)';
  if (!p.hasSummary) detailP.style.fontStyle = 'italic';
  detailP.textContent = p.summary;
  detail.appendChild(detailP);

  function toggle(){
    const expanded = row.getAttribute('aria-expanded') === 'true';
    row.setAttribute('aria-expanded', String(!expanded));
    detail.style.display = expanded ? 'none' : 'block';
  }
  row.addEventListener('click', toggle);
  row.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });

  wrap.appendChild(row);
  wrap.appendChild(detail);
  return wrap;
}

const body = document.getElementById('rm-body');
const sectionLabels = { dan: owners.dan.label, matt: owners.matt.label, joint: 'Joint projects (Dan & Matt)' };
['dan','matt','joint'].forEach(ownerKey => {
  const section = document.createElement('div');
  section.className = 'rm-section';
  section.textContent = sectionLabels[ownerKey];
  body.appendChild(section);
  projects.filter(p => p.owner === ownerKey).forEach(p => body.appendChild(buildRow(p)));
});
</script>
</body>
</html>
